remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: sunrise

title: DoolEats
description: Hell yes

# User site (username.github.io): leave baseurl empty
# Project site (username.github.io/repo-name): set baseurl: "/repo-name"
url: "https://dooleats.github.io"
baseurl: ""

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

collections:
  reviews:
    output: true
    permalink: /reviews/:path/
  lists:
    output: true
    permalink: /lists/:path/

defaults:
  - scope:
      path: ""
      type: reviews
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: lists
    values:
      layout: single
      author_profile: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
